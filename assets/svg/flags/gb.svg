<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 0 30 30" width="30" height="30">
  <title>Flag of the United Kingdom</title>
  <!-- United Kingdom (Union Jack), official 60x30 geometry, centre crop for a round icon.
       The red saltire is counterchanged: clipped to alternate triangles. -->
  <defs>
    <clipPath id="counterchange">
      <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/>
    </clipPath>
  </defs>
  <rect width="60" height="30" fill="#012169"/>
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#counterchange)" stroke="#c8102e" stroke-width="4"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
</svg>
